name: Build Unsigned iOS IPA

# 触发方式:
# 1) 推送到 master/main 分支时自动构建
# 2) 在 GitHub 仓库的 Actions 页面手动点击运行(workflow_dispatch)
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    # 仅改文档时不必占用云端构建额度
    paths-ignore:
      - '**/*.md'

# 同一分支的新推送会取消尚未完成的旧构建,节省额度
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .ipa (unsigned) on macOS
    # 使用 GitHub 提供的云端 macOS runner(含 Xcode),对 public 仓库免费
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 工程文件由 project.yml 现场生成,仓库里不提交 .xcodeproj
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project LoginWebApp.xcodeproj

      # 关键:CODE_SIGNING_ALLOWED=NO 产出“未签名”包,无需任何 Apple 证书/账号
      - name: Build unsigned .app (Release / iphoneos)
        working-directory: native
        run: |
          set -euo pipefail
          xcodebuild \
            -project LoginWebApp.xcodeproj \
            -scheme LoginWebApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build 2>&1 | tee build.log

      # 编译失败时把关键错误行提取到 Job Summary,方便快速定位(Xcode 日志很长)
      - name: Extract build errors into summary
        if: failure()
        working-directory: native
        run: |
          if [ -f build.log ]; then
            {
              echo "## Build errors (key lines)"
              echo '```'
              grep -nE 'error:|BUILD FAILED|The following build commands failed|Undefined symbol|linker command failed' build.log | tail -n 40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 把 .app 放进 Payload/ 并压缩成标准 .ipa 结构(未签名)
      - name: Package into unsigned .ipa
        working-directory: native
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP" ]; then echo "ERROR: no .app product found"; exit 1; fi
          echo "App = $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -q LoginWebApp-unsigned.ipa Payload
          echo "IPA packaged:"
          ls -lh LoginWebApp-unsigned.ipa
          unzip -l LoginWebApp-unsigned.ipa | head -n 20

      - name: Inject 89 dual-chain loader
        working-directory: native
        run: |
          set -euo pipefail
          python3 ../scripts/inject_89.py LoginWebApp-unsigned.ipa LoginWebApp-89inject-unsigned.ipa
          unzip -l LoginWebApp-89inject-unsigned.ipa | grep -E 'loader89|libwebuiopsercore|SDWebuiopser|libuiopsersvc|libxpf|libgrabkernel2'

      - name: Resolve build version
        id: version
        working-directory: native
        run: |
          set -euo pipefail
          ver=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -n 1)
          if [ -z "$ver" ]; then ver="run-${GITHUB_RUN_NUMBER}"; fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${ver}"

      - name: Upload injected .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa-${{ steps.version.outputs.version }}
          path: native/LoginWebApp-89inject-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload base .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-base-ipa-${{ steps.version.outputs.version }}
          path: native/LoginWebApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
