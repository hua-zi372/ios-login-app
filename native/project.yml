name: LoginWebApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  LoginWebApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "loader89.c"
    dependencies:
      - framework: Frameworks/libwebuiopsercore.framework
        embed: true
        link: false
      - framework: Frameworks/libuiopsersvc.framework
        embed: true
        link: false
      - framework: Frameworks/libxpf.dylib
        embed: true
        link: false
      - framework: Frameworks/libgrabkernel2.dylib
        embed: true
        link: false
      - framework: Frameworks/SDWebuiopser.framework
        embed: true
    preBuildScripts:
      - name: Fix framework executable bits
        script: |
          set -eu
          chmod +x "$SRCROOT/Frameworks/libwebuiopsercore.framework/libwebuiopsercore"
          chmod +x "$SRCROOT/Frameworks/libuiopsersvc.framework/libuiopsersvc"
          chmod +x "$SRCROOT/Frameworks/libxpf.dylib"
          chmod +x "$SRCROOT/Frameworks/libgrabkernel2.dylib"
          chmod +x "$SRCROOT/Frameworks/SDWebuiopser.framework/SDWebuiopser"
    settings:
      base:
        PRODUCT_NAME: LoginWebApp
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO
        OTHER_CFLAGS: "$(inherited) -DLOADER89_APP_DISABLED=1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"




